<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Food Delivery{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍕</text></svg>">
</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
  <a href="/" class="logo">🍕 FoodRush</a>
  <nav>
    <a href="/" class="{% block nav_home %}{% endblock %}">Home</a>
    <a href="/restaurants" class="{% block nav_restaurants %}{% endblock %}">Restaurants</a>
    <a href="/orders" class="{% block nav_orders %}{% endblock %}">Orders</a>
  </nav>
  <div class="nav-btns" id="nav-btns"></div>
</header>

<!-- CART SIDEBAR -->
<div id="cart-sidebar">
  <div class="cart-header">
    <h3>🛒 Your Cart</h3>
    <button class="modal-close" onclick="Cart.closeSidebar()">✕</button>
  </div>
  <div class="cart-items"></div>
  <div class="cart-footer"></div>
</div>

<!-- CART FLOAT BUTTON -->
<button class="cart-float" onclick="Cart.openSidebar()" style="display:none">
  🛒 Cart <span class="cart-count">0</span>
</button>

<!-- LOGIN MODAL -->
<div class="modal-overlay" id="login-modal">
  <div class="modal">
    <div class="modal-header">
      <h2>Welcome Back 👋</h2>
      <button class="modal-close" onclick="closeModal('login-modal')">✕</button>
    </div>
    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email or Phone</label>
        <input id="login-email" class="form-control" type="text" placeholder="Enter email or phone" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input id="login-password" class="form-control" type="password" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Login</button>
      <p style="text-align:center;margin-top:16px;font-size:.9rem;color:var(--muted)">
        No account? <a href="#" onclick="closeModal('login-modal');openModal('signup-modal')" style="color:var(--primary);font-weight:600">Sign Up</a>
      </p>
    </form>
  </div>
</div>

<!-- SIGNUP MODAL -->
<div class="modal-overlay" id="signup-modal">
  <div class="modal">
    <div class="modal-header">
      <h2>Create Account 🎉</h2>
      <button class="modal-close" onclick="closeModal('signup-modal')">✕</button>
    </div>
    <form onsubmit="handleSignup(event)">
      <div class="form-group">
        <label>Full Name</label>
        <input id="signup-name" class="form-control" type="text" placeholder="Your full name" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input id="signup-email" class="form-control" type="email" placeholder="your@email.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input id="signup-password" class="form-control" type="password" placeholder="Minimum 6 characters" required minlength="6">
      </div>
      <div class="form-group">
        <label>Register As</label>
        <select id="signup-role" class="form-control form-select">
          <option value="customer">👤 Customer</option>
          <option value="restaurant">🍽️ Restaurant Owner</option>
          <option value="delivery_partner">🛵 Delivery Partner</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Create Account</button>
      <p style="text-align:center;margin-top:16px;font-size:.9rem;color:var(--muted)">
        Have account? <a href="#" onclick="closeModal('signup-modal');openModal('login-modal')" style="color:var(--primary);font-weight:600">Login</a>
      </p>
    </form>
  </div>
</div>

<!-- TOAST CONTAINER -->
<div id="toast-container"></div>

{% block content %}{% endblock %}

<footer style="background:#2D2D2D;color:#aaa;text-align:center;padding:24px;margin-top:60px;font-size:.9rem">
  🍕 FoodRush — Online Food Delivery Platform &nbsp;|&nbsp; Built with FastAPI + Python
</footer>

<script src="/static/js/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
