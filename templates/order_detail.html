{% extends "base.html" %}
{% block title %}Order Tracking — FoodRush{% endblock %}

{% block content %}
<div class="page" style="max-width:800px">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:28px">
    <a href="/orders" style="color:var(--muted);font-size:.9rem">← Back to Orders</a>
  </div>
  <div id="order-content"><div class="spinner"></div></div>
</div>
{% endblock %}

{% block scripts %}
<script>
const ORDER_ID = {{ order_id }};

const STATUS_ICONS = {
  confirmed:'✅', preparing:'👨‍🍳', ready_for_pickup:'📦',
  picked_up:'🛵', out_for_delivery:'🚀', delivered:'🎉', cancelled:'❌'
};
const STATUS_ORDER = ['confirmed','preparing','ready_for_pickup','picked_up','out_for_delivery','delivered'];

async function loadOrder() {
  try {
    const [order, tracking] = await Promise.all([
      api('GET', `/orders/${ORDER_ID}`),
      api('GET', `/orders/${ORDER_ID}/track`)
    ]);
    renderOrder(order, tracking);
  } catch(e) {
    document.getElementById('order-content').innerHTML = `<div class="alert alert-danger">${e.message}</div>`;
  }
}

function renderOrder(order, tracking) {
  const currentIdx = STATUS_ORDER.indexOf(order.status);
  document.getElementById('order-content').innerHTML = `
    <!-- STATUS HEADER -->
    <div style="background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:var(--radius);padding:24px;color:#fff;margin-bottom:24px">
      <div style="font-size:2rem;margin-bottom:8px">${STATUS_ICONS[order.status]||'📦'}</div>
      <h2 style="font-family:'Playfair Display',serif;font-size:1.6rem;margin-bottom:4px">
        ${order.status === 'delivered' ? 'Order Delivered!' : order.status === 'cancelled' ? 'Order Cancelled' : 'Order in Progress'}
      </h2>
      <div style="opacity:.9;font-size:.9rem">Order #${order.order_number}</div>
      ${order.estimated_delivery_time ? `<div style="margin-top:8px;font-size:.88rem;opacity:.85">
        Estimated delivery: ${new Date(order.estimated_delivery_time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}
      </div>` : ''}
    </div>

    <div style="display:grid;grid-template-columns:1fr 300px;gap:24px">
      <!-- TRACKING STEPS -->
      <div>
        <div class="card" style="margin-bottom:20px">
          <div class="card-body">
            <h3 style="font-family:'Playfair Display',serif;margin-bottom:20px">🗺️ Live Tracking</h3>
            <div class="tracking-steps">
              ${tracking.tracking_steps.map(step => `
                <div class="tracking-step ${step.completed ? 'done' : ''} ${step.current ? 'current' : ''}">
                  <div class="step-dot">${step.completed ? (step.current ? step.icon : '✓') : step.icon}</div>
                  <div class="step-info">
                    <div class="step-label">${step.step}</div>
                    <div class="step-time">${step.completed ? (step.current ? 'In progress...' : 'Completed') : 'Pending'}</div>
                  </div>
                </div>`).join('')}
            </div>
          </div>
        </div>

        ${tracking.delivery_partner ? `
        <div class="card">
          <div class="card-body">
            <h3 style="font-family:'Playfair Display',serif;margin-bottom:16px">🛵 Delivery Partner</h3>
            <div style="display:flex;align-items:center;gap:16px">
              <div style="width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:#fff;font-weight:700">
                ${tracking.delivery_partner.name[0]}
              </div>
              <div>
                <div style="font-weight:700">${tracking.delivery_partner.name}</div>
                <div style="font-size:.85rem;color:var(--muted)">${tracking.delivery_partner.vehicle_number}</div>
                <div style="font-size:.85rem;color:var(--warning)">⭐ ${tracking.delivery_partner.rating.toFixed(1)}</div>
              </div>
            </div>
          </div>
        </div>` : ''}
      </div>

      <!-- ORDER DETAILS -->
      <div>
        <div class="card" style="margin-bottom:16px">
          <div class="card-body">
            <h3 style="font-family:'Playfair Display',serif;margin-bottom:16px">🧾 Order Details</h3>
            ${order.order_items.map(item => `
              <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:.88rem">
                <span>${item.item_name} × ${item.quantity}</span>
                <span style="font-weight:600">₹${item.subtotal.toFixed(0)}</span>
              </div>`).join('')}
            <div style="margin-top:12px">
              <div class="cart-total-row" style="font-size:.88rem"><span style="color:var(--muted)">Subtotal</span><span>₹${order.subtotal.toFixed(0)}</span></div>
              <div class="cart-total-row" style="font-size:.88rem"><span style="color:var(--muted)">Tax</span><span>₹${order.tax_amount.toFixed(0)}</span></div>
              <div class="cart-total-row" style="font-size:.88rem"><span style="color:var(--muted)">Delivery</span><span>₹${order.delivery_charge.toFixed(0)}</span></div>
              ${order.discount_amount > 0 ? `<div class="cart-total-row" style="font-size:.88rem;color:var(--success)"><span>Discount</span><span>-₹${order.discount_amount.toFixed(0)}</span></div>` : ''}
              <div class="cart-total-row grand"><span>Total</span><span style="color:var(--primary)">₹${order.total_amount.toFixed(0)}</span></div>
            </div>
          </div>
        </div>

        <div class="card" style="margin-bottom:16px">
          <div class="card-body">
            <h3 style="font-family:'Playfair Display',serif;margin-bottom:12px">💳 Payment</h3>
            <div style="font-size:.9rem">
              <div style="display:flex;justify-content:space-between;margin-bottom:6px">
                <span style="color:var(--muted)">Method</span>
                <span style="font-weight:600">${order.payment_method.replace(/_/g,' ').toUpperCase()}</span>
              </div>
              <div style="display:flex;justify-content:space-between">
                <span style="color:var(--muted)">Status</span>
                <span class="badge badge-${order.payment_status==='completed'?'success':'warning'}">${order.payment_status.toUpperCase()}</span>
              </div>
            </div>
          </div>
        </div>

        ${order.status !== 'delivered' && order.status !== 'cancelled' ? `
        <button onclick="cancelOrder(${order.id})" class="btn btn-danger" style="width:100%;justify-content:center">
          Cancel Order
        </button>` : ''}

        ${order.status === 'delivered' ? `
        <button onclick="window.location='/rate/${order.id}'" class="btn btn-primary" style="width:100%;justify-content:center">
          ⭐ Rate Your Order
        </button>` : ''}
      </div>
    </div>`;

  // Auto-refresh if order is active
  if (!['delivered','cancelled'].includes(order.status)) {
    setTimeout(loadOrder, 15000);
  }
}

async function cancelOrder(orderId) {
  if (!confirm('Are you sure you want to cancel this order?')) return;
  try {
    await api('POST', `/orders/${orderId}/cancel`);
    toast('Order cancelled', 'info');
    loadOrder();
  } catch(e) { toast(e.message, 'error'); }
}

loadOrder();
</script>
{% endblock %}
